<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Наши траты</title>
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1017" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Траты">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app (max 520px), fixed bottom tab bar with a raised add button, bottom sheets for input */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#E3E7EF; --ink:#131925; --muted:#667089; --line:rgba(19,25,37,.08);
  --pa:#2F67F0; --pn:#E04C79; --ps:#14946B; --inc:#14946B; --danger:#D23F37; --nocat:#8A93A6;
  --shadow:0 1px 2px rgba(19,25,37,.05),0 6px 20px rgba(19,25,37,.06);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1017; --surface:#161A24; --surface-2:#222836; --ink:#EDF0F6; --muted:#8B94A8; --line:rgba(237,240,246,.08);
  --pa:#6A93FF; --pn:#FF7099; --ps:#35C793; --inc:#35C793; --danger:#FF6B62; --nocat:#5E677B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1017; --surface:#161A24; --surface-2:#222836; --ink:#EDF0F6; --muted:#8B94A8; --line:rgba(237,240,246,.08);
  --pa:#6A93FF; --pn:#FF7099; --ps:#35C793; --inc:#35C793; --danger:#FF6B62; --nocat:#5E677B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pa);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(112px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;min-height:44px}
.top h1{font:600 21px/1.2 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.badge{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:5px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);flex:none}
.view{display:flex;flex-direction:column;gap:12px}
.view.enter>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- hero balance ---------- */
.hero{background:var(--ink);color:var(--bg);border-radius:26px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;opacity:.62}
.hero .big{font:600 clamp(30px,9.5vw,42px)/1.08 var(--f-display);letter-spacing:-.025em;white-space:nowrap;margin-top:6px;font-variant-numeric:tabular-nums}
.split{display:flex;height:8px;border-radius:8px;overflow:hidden;background:rgba(127,127,127,.25)}
.split i{display:block;height:100%;transition:width .9s var(--ease)}
.split i+i{box-shadow:inset 2px 0 0 var(--ink)}
.hero .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero .row small{display:block;font-size:12px;opacity:.62}
.hero .row b{font:600 16px/1.3 var(--f-body);font-variant-numeric:tabular-nums}

/* ---------- people tiles ---------- */
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pt{background:var(--surface);border-radius:18px;padding:12px 12px 13px;display:flex;flex-direction:column;gap:7px;min-width:0;text-align:left;transition:transform .15s var(--ease)}
.pt:active{transform:scale(.97)}
.pt .nm{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden}
.pt .v{font:700 16px/1.2 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.track{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.fill{display:block;height:100%;border-radius:5px;width:0;transition:width .9s var(--ease)}

/* ---------- cards / lists ---------- */
.card{background:var(--surface);border-radius:22px;padding:16px}
.card h2{font:700 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{font-size:13.5px;color:var(--pa);text-transform:none;letter-spacing:0;font-weight:600}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.tx+.tx{border-top:1px solid var(--line)}
.tx:active{opacity:.6}
.ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font:600 15px var(--f-display);flex:none;color:#fff}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.t2 .nt{overflow:hidden;text-overflow:ellipsis}
.who{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;flex:none;background:var(--surface-2)}
.who.a{color:var(--pa);background:color-mix(in srgb,var(--pa) 14%,transparent)}
.who.n{color:var(--pn);background:color-mix(in srgb,var(--pn) 14%,transparent)}
.who.s{color:var(--ps);background:color-mix(in srgb,var(--ps) 14%,transparent)}
.sum{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.sum.inc{color:var(--inc)}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px;line-height:1.5}
.dayh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--muted);padding:2px 2px 0}
.dayh span:first-letter{text-transform:uppercase}

/* ---------- controls ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:3px;position:relative}
.seg button{flex:1;padding:8px 4px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--muted);position:relative;z-index:1;transition:color .25s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n));border-radius:11px;background:var(--surface);box-shadow:var(--shadow);transform:translateX(calc(var(--idx,0) * 100%));transition:transform .4s var(--ease)}
.card .seg{background:var(--surface-2)}
.mswitch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mswitch b{font:600 17px var(--f-display);text-align:center}
.iconbtn{width:42px;height:42px;border-radius:13px;background:var(--surface);display:grid;place-items:center;flex:none;transition:transform .15s,opacity .2s}
.iconbtn:active{transform:scale(.92)}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn svg{width:20px;height:20px}
.btn{height:52px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;width:100%;transition:opacity .2s,transform .15s,background .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.3}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);height:44px;font-size:15px}
.btn.danger.armed{background:var(--danger);color:#fff}
.field{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:13px;padding:0 13px;height:46px;min-width:0}
.field input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%;font-size:16px}
.field input::placeholder{color:var(--muted)}
.field svg{width:18px;height:18px;color:var(--muted);flex:none}

/* ---------- stats ---------- */
.donut{width:200px;height:200px;margin:4px auto 6px;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.donut circle{fill:none;stroke-width:15}
.donut .ring{stroke:var(--surface-2)}
.donut .sg{transition:stroke-dasharray 1s var(--ease),stroke-dashoffset 1s var(--ease)}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.donut .ctr small{font-size:12px;color:var(--muted);font-weight:600}
.donut .ctr b{font:600 20px/1.15 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;max-width:140px}
.delta{display:flex;justify-content:center;margin-bottom:14px}
.delta span{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.delta .up{color:var(--danger)} .delta .dn{color:var(--inc)}
.lg{display:flex;align-items:center;gap:10px;padding:8px 0}
.lg .mid{gap:6px}
.lt{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.lt span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt b{white-space:nowrap;font-variant-numeric:tabular-nums}
.pct{width:40px;text-align:right;font-size:12.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.cnt{font-size:12px;color:var(--muted);font-weight:500}
.days{display:flex;align-items:flex-end;gap:2px;height:130px}
.day{flex:1;height:100%;display:flex;flex-direction:column-reverse;gap:1px;min-width:0}
.day i{display:block;width:100%;border-radius:3px;height:0;transition:height .9s var(--ease)}
.day .z{background:var(--surface-2);height:3px!important;transition:none}
.day.today{position:relative}
.day.today::after{content:"";position:absolute;left:50%;bottom:-7px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink)}
.dl{display:flex;gap:2px;margin-top:12px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dl span{flex:1;min-width:0;text-align:center;overflow:visible;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14.5px}
.kv+.kv{border-top:1px solid var(--line)}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:10px 0 0}

/* ---------- settings ---------- */
.crow{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;text-align:left}
.crow+.crow{border-top:1px solid var(--line)}
.crow .sw{width:30px;height:30px;border-radius:10px;flex:none}
.crow .mid span{font-weight:600}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-top:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:5px 0;transition:color .2s}
.tab svg{width:24px;height:24px;transition:transform .3s var(--ease)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.06)}
.fab{justify-self:center;width:58px;height:58px;border-radius:20px;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 10px 26px rgba(10,14,24,.28);transform:translateY(-12px);transition:transform .25s var(--ease)}
.fab:active{transform:translateY(-12px) scale(.9)}
.fab svg{width:26px;height:26px}

/* ---------- sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(6,9,15,.5);opacity:0;pointer-events:none;transition:opacity .4s var(--ease);z-index:40}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;z-index:41;background:var(--surface);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .5s var(--ease);max-height:calc(100% - env(safe-area-inset-top,0px) - 16px);overflow-y:auto;overscroll-behavior:contain;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet.vis{visibility:visible}
.sheet.drag{transition:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--surface-2);margin:2px auto 0;flex:none}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-h h3{font:600 17px var(--f-display);margin:0}
.x{width:34px;height:34px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center}
.x svg{width:16px;height:16px}
.amtd{font:600 46px/1.1 var(--f-display);text-align:center;padding:6px 0 2px;letter-spacing:-.025em;white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .2s}
.amtd .cur{color:var(--muted);font-size:.6em;margin-left:.15em}
.amtd.zero{color:var(--muted)}
.amtd.pop{animation:pop .2s var(--ease)}
@keyframes pop{50%{transform:scale(1.045)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.whos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow-y:auto;padding:1px}
.chip{padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .25s,color .25s,transform .15s;white-space:nowrap;min-width:0}
.chip:active{transform:scale(.95)}
.chip .dot{transition:background .25s}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff}
.chip[aria-pressed="true"] .dot{background:#fff!important}
.lbl2{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.row2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.datef{cursor:pointer;font-weight:600;font-size:14.5px;white-space:nowrap}
.datef input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{height:52px;border-radius:14px;background:var(--surface-2);font:500 22px var(--f-display);display:grid;place-items:center;transition:transform .1s,background .15s}
.pad button:active{transform:scale(.93);background:var(--line)}
.pad svg{width:24px;height:24px}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.swatches button{aspect-ratio:1;max-width:100%;border-radius:12px;transition:transform .2s var(--ease);position:relative}
.swatches button[aria-pressed="true"]{transform:scale(.86);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.collapse{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s var(--ease),opacity .25s}
.collapse>div{overflow:hidden;display:flex;flex-direction:column;gap:8px}
.collapse.shut{grid-template-rows:0fr;opacity:0}

/* ---------- splash / login / toast ---------- */
.center{min-height:100%;display:grid;place-items:center;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:40px}
.mark{display:flex;align-items:flex-end;gap:5px;height:44px}
.mark i{width:12px;border-radius:5px;display:block}
.splash .mark i{animation:bar 1.1s var(--ease) infinite alternate}
.splash .mark i:nth-child(2){animation-delay:.15s}.splash .mark i:nth-child(3){animation-delay:.3s}
@keyframes bar{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
.mark i{transform-origin:bottom}
.splash p{color:var(--muted);margin:16px 0 0;text-align:center}
.login{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.login h1{font:600 26px var(--f-display);margin:18px 0 2px;letter-spacing:-.02em}
.login p{color:var(--muted);margin:0 0 10px}
.err{color:var(--danger);font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:60;transition:opacity .35s var(--ease),transform .35s var(--ease);pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="splash" class="center splash">
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="mark"><i style="height:26px;background:var(--pa)"></i><i style="height:44px;background:var(--pn)"></i><i style="height:34px;background:var(--ps)"></i></div>
    <p id="splashTxt">Загружаем…</p>
  </div>
</div>

<div id="login" class="center" hidden>
  <form class="login" id="loginForm" novalidate>
    <div class="mark"><i style="height:26px;background:var(--pa)"></i><i style="height:44px;background:var(--pn)"></i><i style="height:34px;background:var(--ps)"></i></div>
    <h1>Наши траты</h1>
    <p>Войди под своей почтой. Данные общие для вас двоих.</p>
    <label class="field"><input id="lEmail" type="email" autocomplete="username" placeholder="Почта" required></label>
    <label class="field"><input id="lPass" type="password" autocomplete="current-password" placeholder="Пароль" required></label>
    <div class="err" id="lErr" role="alert"></div>
    <button class="btn" id="lBtn" type="submit">Войти</button>
  </form>
</div>

<div id="main" hidden>
  <div class="app">
    <header class="top">
      <div><h1 id="topTitle">Главная</h1><div class="sub" id="topSub"></div></div>
      <span class="badge" id="demoBadge" hidden>Демо</span>
    </header>
    <main id="view" class="view"></main>
  </div>

  <nav class="nav" aria-label="Разделы">
    <div class="in">
      <button class="tab" data-tab="home" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>Главная</button>
      <button class="tab" data-tab="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Статистика</button>
      <button class="fab" id="fab" aria-label="Добавить трату">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<script src="config.js"></script>
<script>
(function(){
'use strict';

/* ================= конфиг ================= */
var CFG = window.APP_CONFIG || {};
var P = CFG.people || {};
var PEOPLE = {
  a: { name: (P.a && P.a.name) || 'Артём', email: ((P.a && P.a.email) || '').trim().toLowerCase() },
  n: { name: (P.n && P.n.name) || 'Настя', email: ((P.n && P.n.email) || '').trim().toLowerCase() },
  s: { name: CFG.sharedName || 'Общие' }
};
var WHO = ['a','n','s'];
var DEMO = !(CFG.firebase && CFG.firebase.apiKey);
var FB_VER = '10.12.2';
var DEFAULT_CATS = [
  ['c01','Продукты','#F59E0B'],['c02','Кафе и доставка','#EF4444'],['c03','Транспорт','#3B82F6'],
  ['c04','Жильё и коммуналка','#8B5CF6'],['c05','Связь и интернет','#06B6D4'],['c06','Одежда','#EC4899'],
  ['c07','Здоровье','#10B981'],['c08','Развлечения','#F97316'],['c09','Подарки','#E11D48'],
  ['c10','Подписки','#6366F1'],['c11','Красота и уход','#D946EF'],['c12','Другое','#64748B']
];
var PALETTE = ['#F59E0B','#EF4444','#F97316','#E11D48','#EC4899','#D946EF','#8B5CF6','#6366F1','#3B82F6','#06B6D4','#14B8A6','#10B981','#84CC16','#64748B'];
var CIRC = 2 * Math.PI * 80;
var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= утилиты ================= */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function dstr(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function today(){ return dstr(new Date()); }
function curMonth(){ return today().slice(0,7); }
function shiftMonth(m, k){ var y = +m.slice(0,4), mo = +m.slice(5,7) - 1 + k; var d = new Date(y, mo, 1); return d.getFullYear() + '-' + pad2(d.getMonth()+1); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function monthLabel(m){ var d = new Date(+m.slice(0,4), +m.slice(5,7)-1, 1); return cap(d.toLocaleDateString('ru-RU', {month:'long'})) + ' ' + d.getFullYear(); }
function dayLabel(s){
  if (s === today()) return 'Сегодня';
  var y = new Date(); y.setDate(y.getDate()-1);
  if (s === dstr(y)) return 'Вчера';
  var d = new Date(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10));
  var o = {day:'numeric', month:'long', weekday:'short'};
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('ru-RU', o);
}
function shortDate(s){
  if (s === today()) return 'Сегодня';
  var y = new Date(); y.setDate(y.getDate()-1);
  if (s === dstr(y)) return 'Вчера';
  var d = new Date(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10));
  return d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'}).replace('.', '');
}
var NF = new Intl.NumberFormat('uk-UA', {minimumFractionDigits:0, maximumFractionDigits:2});
var NF0 = new Intl.NumberFormat('uk-UA', {maximumFractionDigits:0});
function money(k, round){ var s = (round ? NF0.format(Math.round(k/100)) : NF.format(k/100)).replace(/[ \s]/g, ' '); return s + ' ₴'; }
function sum(a){ var s = 0; for (var i = 0; i < a.length; i++) s += a[i].amount || 0; return s; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function okColor(c){ return /^#[0-9a-f]{6}$/i.test(c || '') ? c : '#64748B'; }
function vib(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} }

/* ================= состояние ================= */
var S = { tx:[], cats:[], settings:{startBalance:0}, me:'a', email:'', view:'home', month:curMonth(), statsWho:'all', histWho:'all', histType:'all', ready:{tx:false,cats:false} };
var store = null;

function catOf(id){ for (var i = 0; i < S.cats.length; i++) if (S.cats[i].id === id) return S.cats[i]; return null; }
function sortTx(a, b){ return (b.date || '').localeCompare(a.date || '') || (b.ts || 0) - (a.ts || 0); }
function txOfMonth(m){ return S.tx.filter(function(t){ return t.date && t.date.slice(0,7) === m; }); }
function balance(){
  var b = +S.settings.startBalance || 0;
  S.tx.forEach(function(t){ b += t.type === 'income' ? t.amount : -t.amount; });
  return b;
}

/* ================= хранилище: демо ================= */
function makeDemo(){
  var seed = 11; function r(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function pick(a){ return a[Math.floor(r() * a.length)]; }
  var tx = [], n = 0, now = new Date();
  function add(date, type, amount, who, cat, note){ n++; tx.push({id:'d'+n, type:type, amount:Math.round(amount)*100, who:who, cat:cat, date:date, note:note, by:'demo', ts:n}); }
  for (var back = 1; back >= 0; back--){
    var first = new Date(now.getFullYear(), now.getMonth() - back, 1);
    var dim = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
    var last = back ? dim : now.getDate();
    for (var d = 1; d <= last; d++){
      var ds = dstr(new Date(first.getFullYear(), first.getMonth(), d));
      if (d === 5) add(ds,'income',28000,'a',null,'Зарплата');
      if (d === 10) add(ds,'income',21000,'n',null,'Зарплата');
      if (d === 3) add(ds,'expense',3150 + r()*400,'s','c04','Коммуналка');
      if (d === 7){ add(ds,'expense',250,'a','c05','Мобильный'); add(ds,'expense',230,'n','c05','Мобильный'); add(ds,'expense',300,'s','c05','Домашний интернет'); }
      if (d === 12) add(ds,'expense',299,'s','c10','Netflix');
      if (r() < .55) add(ds,'expense',280 + r()*1100,'s','c01',pick(['АТБ','Сильпо','Новус','Рынок']));
      if (r() < .55) add(ds,'expense',pick([16,30,30,140,190]),'a','c03',pick(['Метро','Маршрутка','Такси']));
      if (r() < .5) add(ds,'expense',pick([16,30,30,160,210]),'n','c03',pick(['Метро','Маршрутка','Такси']));
      if (r() < .28) add(ds,'expense',120 + r()*520,pick(['a','n','s']),'c02',pick(['Кофе','Пицца','Доставка','Суши']));
      if (r() < .07) add(ds,'expense',700 + r()*2200,pick(['n','n','a']),'c06',pick(['Куртка','Кроссовки','Свитер']));
      if (r() < .07) add(ds,'expense',350 + r()*900,'s','c08',pick(['Кино','Боулинг','Концерт']));
      if (r() < .05) add(ds,'expense',180 + r()*700,pick(['a','n']),'c07','Аптека');
      if (r() < .05) add(ds,'expense',300 + r()*700,'n','c11',pick(['Маникюр','Косметика']));
    }
  }
  return { tx:tx, cats:DEFAULT_CATS.map(function(c,i){ return {id:c[0], name:c[1], color:c[2], order:i}; }), settings:{startBalance:1200000, seeded:true} };
}

function DemoStore(){
  var KEY = 'nashi-traty-demo-v1', data = null;
  try { data = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){}
  if (!data || !data.tx) data = makeDemo();
  var subs = {tx:[], cats:[], settings:[]};
  function emit(){
    subs.tx.forEach(function(f){ f(data.tx.slice()); });
    subs.cats.forEach(function(f){ f(data.cats.slice()); });
    subs.settings.forEach(function(f){ f(Object.assign({}, data.settings)); });
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} setTimeout(emit, 0); return Promise.resolve(); }
  function idx(a, id){ for (var i = 0; i < a.length; i++) if (a[i].id === id) return i; return -1; }
  return {
    listen: function(onTx, onCats, onSet){
      subs.tx.push(onTx); subs.cats.push(onCats); subs.settings.push(onSet);
      setTimeout(emit, 350);
      return function(){ subs = {tx:[], cats:[], settings:[]}; };
    },
    addTx: function(t){ t.id = uid(); data.tx.push(t); return save(); },
    updateTx: function(id, p){ var i = idx(data.tx, id); if (i > -1) Object.assign(data.tx[i], p); return save(); },
    deleteTx: function(id){ var i = idx(data.tx, id); if (i > -1) data.tx.splice(i, 1); return save(); },
    addCat: function(c){ c.id = uid(); data.cats.push(c); return save(); },
    updateCat: function(id, p){ var i = idx(data.cats, id); if (i > -1) Object.assign(data.cats[i], p); return save(); },
    deleteCat: function(id){ var i = idx(data.cats, id); if (i > -1) data.cats.splice(i, 1); return save(); },
    setSettings: function(p){ Object.assign(data.settings, p); return save(); },
    reset: function(){ data = makeDemo(); return save(); }
  };
}

/* ================= хранилище: Firebase ================= */
function loadScript(src){ return new Promise(function(res, rej){ var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }

function FirebaseStore(db){
  var txC = db.collection('tx'), catC = db.collection('categories'), setD = db.collection('settings').doc('main');
  function clean(o){ var r = {}; for (var k in o) if (k !== 'id' && o[k] !== undefined) r[k] = o[k]; return r; }
  function seed(){
    var b = db.batch();
    DEFAULT_CATS.forEach(function(c, i){ b.set(catC.doc(c[0]), {name:c[1], color:c[2], order:i}); });
    b.set(setD, {seeded:true}, {merge:true});
    return b.commit();
  }
  return {
    listen: function(onTx, onCats, onSet){
      var un = [];
      un.push(txC.onSnapshot(function(s){ onTx(s.docs.map(function(d){ var o = d.data(); o.id = d.id; return o; })); }, dbErr));
      un.push(catC.onSnapshot(function(s){ onCats(s.docs.map(function(d){ var o = d.data(); o.id = d.id; return o; })); }, dbErr));
      un.push(setD.onSnapshot(function(d){
        var o = d.exists ? d.data() : {};
        onSet(o);
        if (!d.metadata.fromCache && !o.seeded) seed().catch(dbErr);
      }, dbErr));
      return function(){ un.forEach(function(f){ f(); }); };
    },
    addTx: function(t){ return txC.doc().set(clean(t)); },
    updateTx: function(id, p){ return txC.doc(id).update(clean(p)); },
    deleteTx: function(id){ return txC.doc(id).delete(); },
    addCat: function(c){ return catC.doc().set(clean(c)); },
    updateCat: function(id, p){ return catC.doc(id).update(clean(p)); },
    deleteCat: function(id){ return catC.doc(id).delete(); },
    setSettings: function(p){ return setD.set(p, {merge:true}); }
  };
}
function dbErr(e){
  var c = e && e.code;
  if (c === 'permission-denied') toast('Нет доступа к базе. Проверь, что твоя почта есть в правилах Firestore.', 4500);
  else toast('Не удалось сохранить. Проверь интернет и попробуй ещё раз.', 3500);
  console.error(e);
}

/* ================= анимации ================= */
var prevNum = {}, prevA = {};
function animateNums(root){
  root.querySelectorAll('[data-num]').forEach(function(el){
    var key = el.getAttribute('data-num'), to = +el.getAttribute('data-v'), round = el.hasAttribute('data-round'), pre = el.getAttribute('data-pre') || '';
    var from = key in prevNum ? prevNum[key] : 0;
    prevNum[key] = to;
    if (REDUCED || from === to){ el.textContent = pre + money(to, round); return; }
    var t0 = performance.now(), dur = 750;
    el.textContent = pre + money(from, round);
    (function step(t){
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      el.textContent = pre + money(Math.round(from + (to - from) * e), round);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  });
}
function applyA(el, a, b){
  var k = el.getAttribute('data-kind');
  if (k === 'w') el.style.width = a + '%';
  else if (k === 'h') el.style.height = a + '%';
  else if (k === 'seg') el.style.setProperty('--idx', a);
  else if (k === 'dash'){ el.style.strokeDasharray = a + ' ' + (CIRC - a + 0.001); el.style.strokeDashoffset = -b; }
}
function animateBars(root){
  var els = Array.prototype.slice.call(root.querySelectorAll('[data-ak]'));
  els.forEach(function(el){
    var p = prevA[el.getAttribute('data-ak')];
    if (p) applyA(el, p.a, p.b);
    else if (el.getAttribute('data-kind') === 'dash') applyA(el, 0, +el.getAttribute('data-b') || 0);
    else if (el.getAttribute('data-kind') !== 'seg') applyA(el, 0, 0);
    else applyA(el, +el.getAttribute('data-a'), 0);
  });
  void root.offsetWidth;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    els.forEach(function(el){
      var a = +el.getAttribute('data-a'), b = +el.getAttribute('data-b') || 0;
      applyA(el, a, b); prevA[el.getAttribute('data-ak')] = {a:a, b:b};
    });
  }); });
}

/* ================= кусочки разметки ================= */
var ICON_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>';
var ICON_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>';
var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>';

function whoPill(w){ return '<span class="who ' + w + '">' + esc(PEOPLE[w] ? PEOPLE[w].name : '?') + '</span>'; }
function txRow(t){
  var inc = t.type === 'income', c = inc ? null : catOf(t.cat);
  var color = inc ? 'var(--inc)' : (c ? okColor(c.color) : 'var(--nocat)');
  var title = inc ? 'Пополнение' : (c ? c.name : 'Без категории');
  var letter = inc ? '+' : esc((c ? c.name : '?').trim().charAt(0).toUpperCase());
  return '<button class="tx" data-tx="' + esc(t.id) + '"><span class="ic" style="background:' + color + '">' + letter + '</span>' +
    '<span class="mid"><span class="t1">' + esc(title) + '</span><span class="t2">' + whoPill(t.who) + (t.note ? '<span class="nt">' + esc(t.note) + '</span>' : '') + '</span></span>' +
    '<span class="sum' + (inc ? ' inc' : '') + '">' + (inc ? '+' : '−') + money(t.amount) + '</span></button>';
}
function seg(key, attr, opts, cur){
  var i = 0; opts.forEach(function(o, j){ if (o[0] === cur) i = j; });
  return '<div class="seg" style="--n:' + opts.length + '"><span class="ind" data-ak="' + key + '" data-kind="seg" data-a="' + i + '"></span>' +
    opts.map(function(o){ return '<button type="button" ' + attr + '="' + o[0] + '" aria-pressed="' + (o[0] === cur) + '">' + esc(o[1]) + '</button>'; }).join('') + '</div>';
}
function whoOpts(){ return [['all','Все'],['a',PEOPLE.a.name],['n',PEOPLE.n.name],['s',PEOPLE.s.name]]; }
function mSwitch(){
  var m = S.month;
  return '<div class="mswitch"><button class="iconbtn" data-m="-1" aria-label="Предыдущий месяц">' + ICON_L + '</button><b>' + monthLabel(m) + '</b>' +
    '<button class="iconbtn" data-m="1" aria-label="Следующий месяц"' + (m >= curMonth() ? ' disabled' : '') + '>' + ICON_R + '</button></div>';
}

/* ================= экраны ================= */
function vHome(){
  var m = curMonth(), mt = txOfMonth(m);
  var exp = mt.filter(function(t){ return t.type === 'expense'; }), inc = mt.filter(function(t){ return t.type === 'income'; });
  var spent = sum(exp), got = sum(inc), per = {a:0,n:0,s:0};
  exp.forEach(function(t){ per[t.who] = (per[t.who] || 0) + t.amount; });
  var maxP = Math.max(per.a, per.n, per.s, 1);
  var recent = S.tx.slice().sort(sortTx).slice(0, 6);
  var h = '';

function vStats(){
  var m = S.month, w = S.statsWho;
  function f(t){ return t.type === 'expense' && (w === 'all' || t.who === w); }
  var exp = txOfMonth(m).filter(f), total = sum(exp);

  var inc = txOfMonth(m).filter(function(t){ return t.type === 'income' && (w === 'all' || t.who === w); });
  var byCat = {};
  exp.forEach(function(t){ var k = catOf(t.cat) ? t.cat : '_none'; if (!byCat[k]) byCat[k] = {id:k, sum:0, n:0}; byCat[k].sum += t.amount; byCat[k].n++; });
  var cats = Object.keys(byCat).map(function(k){ return byCat[k]; }).sort(function(a, b){ return b.sum - a.sum; });
  function cInfo(id){ var c = catOf(id); return c ? {name:c.name, color:okColor(c.color)} : {name:'Без категории', color:'var(--nocat)'}; }

  var h = mSwitch();
  h += seg('st-who', 'data-sw', whoOpts(), w);

  // Кольцо по категориям
  var off = 0, ring = '';

    var len = total ? c.sum / total * CIRC : 0, vis = cats.length > 1 ? Math.max(0, len - 2.2) : len;

    off += len;
  });
  h += '<section class="card"><div class="donut"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="ring" cx="100" cy="100" r="80"></circle>' + ring + '</svg>' +
       '<div class="ctr"><small>' + (w === 'all' ? 'Потрачено' : esc(PEOPLE[w].name)) + '</small><b data-num="st-tot" data-v="' + total + '" data-round></b></div></div>';
  if (prevTotal > 0 && total > 0){
    var pct = Math.round((total - prevTotal) / prevTotal * 100);
    h += '<div class="delta"><span class="' + (pct > 0 ? 'up' : pct < 0 ? 'dn' : '') + '">' + (pct > 0 ? '▲ ' + pct : pct < 0 ? '▼ ' + (-pct) : '0') + '% к прошлому месяцу</span></div>';
  } else h += '<div class="delta"><span>' + (exp.length ? exp.length + ' ' + plural(exp.length, 'трата', 'траты', 'трат') : 'В этом месяце трат нет') + '</span></div>';
  h += cats.length ? cats.map(function(c){
    var ci = cInfo(c.id), p = total ? c.sum / total * 100 : 0;
    return '<div class="lg"><span class="dot" style="background:' + ci.color + '"></span><div class="mid"><div class="lt"><span>' + esc(ci.name) + ' <span class="cnt">· ' + c.n + '</span></span><b>' + money(c.sum, true) + '</b></div>' +
      '<div class="track"><span class="fill" data-ak="st-l-' + esc(c.id) + '" data-kind="w" data-a="' + (c.sum / cats[0].sum * 100).toFixed(2) + '" style="background:' + ci.color + '"></span></div></div><span class="pct">' + (p < 1 && p > 0 ? '<1' : Math.round(p)) + '%</span></div>';
  }).join('') : '<div class="empty">Добавь трату, и здесь появится разбивка по категориям.</div>';
  h += '</section>';

  // По людям
  if (w === 'all'){
    var per = {a:0,n:0,s:0}; exp.forEach(function(t){ per[t.who] = (per[t.who] || 0) + t.amount; });
    h += '<section class="card"><h2>Кто сколько потратил</h2><div class="split" style="height:12px;margin-bottom:8px;background:var(--surface-2)">' +
      WHO.map(function(k){ return '<i data-ak="st-pp-' + k + '" data-kind="w" data-a="' + (total ? per[k] / total * 100 : 0).toFixed(2) + '" style="background:var(--p' + k + ');box-shadow:inset 2px 0 0 var(--surface)"></i>'; }).join('') + '</div>' +
      WHO.map(function(k){ return '<div class="kv"><span style="display:flex;align-items:center;gap:8px"><span class="dot" style="background:var(--p' + k + ')"></span>' + esc(PEOPLE[k].name) + '</span><b>' + money(per[k], true) + ' <span class="cnt">· ' + (total ? Math.round(per[k] / total * 100) : 0) + '%</span></b></div>'; }).join('') +
      '</section>';
  }

  // По дням
  var y = +m.slice(0,4), mo = +m.slice(5,7), dim = new Date(y, mo, 0).getDate();
  var days = []; for (var i = 0; i < dim; i++) days.push({a:0,n:0,s:0,t:0});
  exp.forEach(function(t){ var d = +t.date.slice(8,10) - 1; if (days[d]){ days[d][t.who] += t.amount; days[d].t += t.amount; } });
  var mx = 1; days.forEach(function(d){ if (d.t > mx) mx = d.t; });
  var isCur = m === curMonth(), tday = new Date().getDate();

  days.forEach(function(d, i){
    var cls = 'day' + (isCur && i + 1 === tday ? ' today' : '');
    if (!d.t){ h += '<div class="' + cls + '"><i class="z"></i></div>'; return; }
    var parts = w === 'all' ? WHO.filter(function(k){ return d[k]; }) : [w];
    h += '<div class="' + cls + '">' + parts.map(function(k){ return '<i data-ak="st-dy-' + (i+1) + '-' + k + '" data-kind="h" data-a="' + (d[k] / mx * 100).toFixed(2) + '" style="background:var(--p' + k + ')"></i>'; }).join('') + '</div>';
  });
  h += '</div><div class="dl" aria-hidden="true">';
  for (var j = 1; j <= dim; j++) h += '<span>' + (lbls.indexOf(j) > -1 && !(j === 25 && dim - 25 < 3) ? j : '') + '</span>';
  h += '</div></section>';

  // Итог месяца
  var got = sum(inc);
  h += '<section class="card"><h2>Итог месяца</h2>' +
    '<div class="kv"><span>Пополнения</span><b style="color:var(--inc)">+' + money(got) + '</b></div>' +
    '<div class="kv"><span>Траты</span><b>−' + money(total) + '</b></div>' +
    '<div class="kv"><span>Разница</span><b style="color:' + (got - total >= 0 ? 'var(--inc)' : 'var(--danger)') + '">' + (got - total >= 0 ? '+' : '−') + money(Math.abs(got - total)) + '</b></div></section>';

  // Самые крупные
  var top = exp.slice().sort(function(a, b){ return b.amount - a.amount; }).slice(0, 5);
  if (top.length) h += '<section class="card"><h2>Самые крупные траты</h2><div>' + top.map(txRow).join('') + '</div></section>';
  return h;
}
function plural(n, a, b, c){ var m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c); }

function vHistory(){

var toastT;

/* ================= шторки ================= */
var openSh = null, pushed = false;
function openSheet(id){
  var sh = document.getElementById(id);
  if (openSh && openSh !== sh) openSh.classList.remove('on');
  openSh = sh; sh.scrollTop = 0; sh.style.transform = '';
  sh.classList.add('vis');
  requestAnimationFrame(function(){ sh.classList.add('on'); $('#backdrop').classList.add('on'); });
  if (!pushed){ try { history.pushState({sheet:1}, ''); pushed = true; } catch(e){} }
}
function closeSheet(fromPop){
  if (!openSh) return;
  var sh = openSh; openSh = null;
  sh.classList.remove('on'); sh.style.transform = ''; $('#backdrop').classList.remove('on');
  setTimeout(function(){ if (!sh.classList.contains('on')) sh.classList.remove('vis'); }, 500);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (pushed && !fromPop){ pushed = false; try { history.back(); } catch(e){} }
  else pushed = false;
}
window.addEventListener('popstate', function(){ if (openSh){ pushed = false; closeSheet(true); } });
$('#backdrop').addEventListener('click', function(){ closeSheet(); });
document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', function(){ closeSheet(); }); });
// свайп вниз, чтобы закрыть
document.querySelectorAll('.sheet').forEach(function(sh){
  var y0 = null, dy = 0;
  sh.addEventListener('touchstart', function(e){
    if (sh.scrollTop > 0 || e.target.closest('.chips,input,.pad')) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
  }, {passive:true});
  sh.addEventListener('touchmove', function(e){
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0){ sh.classList.add('drag'); sh.style.transform = 'translateY(' + dy + 'px)'; }
  }, {passive:true});
  sh.addEventListener('touchend', function(){
    if (y0 === null) return;
    sh.classList.remove('drag');
    if (dy > 110) closeSheet(); else sh.style.transform = '';
    y0 = null;
  });
});

var F = null;
function kopToStr(k){ var i = Math.floor(k / 100), f = k % 100; return f ? i + ',' + pad2(f).replace(/0$/, '') : String(i); }
function amtKop(s){ if (!s) return 0; var p = s.split(','); return (+p[0] || 0) * 100 + (+((p[1] || '') + '00').slice(0, 2)); }
function openTx(t){
  F = t ? {mode:'edit', id:t.id, type:t.type, amt:kopToStr(t.amount), who:t.who, cat:t.cat || null, date:t.date, note:t.note || '', ts:t.ts}
        : {mode:'add', id:null, type:'expense', amt:'', who:S.me, cat:null, date:today(), note:'', ts:null};
  $('#txTitle').textContent = F.mode === 'edit' ? 'Изменить' : 'Новая операция';
  $('#fWho').innerHTML = WHO.map(function(k){ return '<button type="button" class="chip" data-fw="' + k + '" style="--c:var(--p' + k + ')"><span class="dot" style="background:var(--p' + k + ')"></span>' + esc(PEOPLE[k].name) + '</button>'; }).join('');
  $('#fCats').innerHTML = S.cats.length ? S.cats.map(function(c){ return '<button type="button" class="chip" data-fc="' + esc(c.id) + '" style="--c:' + okColor(c.color) + '"><span class="dot" style="background:' + okColor(c.color) + '"></span>' + esc(c.name) + '</button>'; }).join('')
    : '<span class="cnt">Категорий нет. Добавь их в настройках.</span>';
  $('#fNote').value = F.note;
  $('#fDate').value = F.date;
  var del = $('#fDel'); del.hidden = F.mode !== 'edit'; del.classList.remove('armed'); del.textContent = 'Удалить';

}
function syncTx(){
  var ft = $('#fType');
  ft.querySelector('.ind').style.setProperty('--idx', F.type === 'income' ? 1 : 0);
  ft.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-ft') === F.type)); });
  $('#fWho').querySelectorAll('[data-fw]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-fw') === F.who)); });
  $('#fCats').querySelectorAll('[data-fc]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-fc') === F.cat)); });
  $('#fCatWrap').classList.toggle('shut', F.type === 'income');
  $('#fDateTxt').textContent = shortDate(F.date);
  var ok = amtKop(F.amt) > 0;
  var s = $('#fSave'); s.disabled = !ok;
  s.textContent = F.mode === 'edit' ? 'Сохранить' : (F.type === 'income' ? 'Добавить пополнение' : 'Добавить трату');
}
function updAmt(silent){
  var el = $('#fAmt'), s = F.amt || '0', p = s.split(',');
  var txt = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (p.length > 1 ? ',' + p[1] : '');
  el.innerHTML = esc(txt) + '<span class="cur">₴</span>';
  el.classList.toggle('zero', !F.amt);
  el.style.fontSize = txt.length > 9 ? '34px' : txt.length > 7 ? '40px' : '';
  if (!silent && !REDUCED){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  syncTx();
}
function press(k){
  var s = F.amt;
  if (k === 'del') s = s.slice(0, -1);
  else if (k === ','){ if (s.indexOf(',') < 0) s = (s || '0') + ','; }
  else {
    if (s.indexOf(',') > -1){ if (s.split(',')[1].length >= 2) return shake($('#fAmt')); }
    else if (s.length >= 7) return shake($('#fAmt'));
    s = s === '0' ? k : s + k;
  }
  F.amt = s; updAmt();
}
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); vib(20); }
$('#pad').addEventListener('click', function(e){ var b = e.target.closest('[data-k]'); if (b) press(b.getAttribute('data-k')); });
$('#fType').addEventListener('click', function(e){ var b = e.target.closest('[data-ft]'); if (!b) return; F.type = b.getAttribute('data-ft'); if (F.type === 'income' && F.mode === 'add' && F.who === 's') F.who = S.me; syncTx(); });
$('#fWho').addEventListener('click', function(e){ var b = e.target.closest('[data-fw]'); if (b){ F.who = b.getAttribute('data-fw'); syncTx(); } });
$('#fCats').addEventListener('click', function(e){ var b = e.target.closest('[data-fc]'); if (b){ F.cat = b.getAttribute('data-fc'); syncTx(); } });
$('#fDate').addEventListener('change', function(e){ if (e.target.value){ F.date = e.target.value; syncTx(); } });
$('#fNote').addEventListener('input', function(e){ F.note = e.target.value; });
$('#fNote').addEventListener('keydown', function(e){ if (e.key === 'Enter') e.target.blur(); });
$('#fSave').addEventListener('click', function(){
  var kop = amtKop(F.amt);
  if (!kop) return shake($('#fAmt'));
  if (F.type === 'expense' && !catOf(F.cat)){ shake($('#fCats')); toast('Выбери категорию'); return; }
  var d = {type:F.type, amount:kop, who:F.who, cat:F.type === 'expense' ? F.cat : null, date:F.date || today(), note:(F.note || '').trim().slice(0, 80)};
  var p;
  if (F.mode === 'edit') p = store.updateTx(F.id, d);
  else { d.by = S.email || 'demo'; d.ts = Date.now(); p = store.addTx(d); }
  p.catch(dbErr);
  vib(12);
  toast(F.mode === 'edit' ? 'Сохранено' : (F.type === 'income' ? 'Пополнение добавлено' : 'Трата добавлена'));

});
$('#fDel').addEventListener('click', function(){
  var b = $('#fDel');
  if (!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent = 'Нажми ещё раз, чтобы удалить'; return; }
  store.deleteTx(F.id).catch(dbErr); vib(20); toast('Удалено'); closeSheet();
});
document.addEventListener('keydown', function(e){
  if (openSh && e.key === 'Escape') return closeSheet();
  if (openSh && openSh.id === 'sTx' && !/INPUT|TEXTAREA/.test((e.target.tagName || ''))){
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === ',' || e.key === '.') press(',');
    else if (e.key === 'Backspace') press('del');
    else if (e.key === 'Enter') $('#fSave').click();
  }
});

  openSheet('sCat');
}
function syncCat(){ $('#cColors').querySelectorAll('[data-cc]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-cc') === C.color)); }); }
$('#cColors').addEventListener('click', function(e){ var b = e.target.closest('[data-cc]'); if (b){ C.color = b.getAttribute('data-cc'); syncCat(); } });
$('#cSave').addEventListener('click', function(){
  var name = $('#cName').value.trim().slice(0, 24);
  if (!name){ shake($('#cName').parentNode); return; }
  var dup = S.cats.some(function(c){ return c.id !== C.id && c.name.toLowerCase() === name.toLowerCase(); });
  if (dup){ toast('Такая категория уже есть'); return; }
  var p;
  if (C.id) p = store.updateCat(C.id, {name:name, color:C.color});
  else { var mx = -1; S.cats.forEach(function(c){ if ((c.order || 0) > mx) mx = c.order || 0; }); p = store.addCat({name:name, color:C.color, order:mx + 1}); }
  p.catch(dbErr); toast(C.id ? 'Категория сохранена' : 'Категория добавлена'); closeSheet();
});
$('#cDel').addEventListener('click', function(){
  var b = $('#cDel');
  if (!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent = 'Удалить? Траты останутся «без категории»'; return; }
  store.deleteCat(C.id).catch(dbErr); toast('Категория удалена'); closeSheet();
});

/* ================= баланс ================= */
$('#bSave').addEventListener('click', function(){
  var raw = $('#bVal').value.replace(/[\s ₴]/g, '').replace(',', '.');
  if (!/^-?\d+(\.\d{0,2})?$/.test(raw)){ shake($('#bVal').parentNode); toast('Впиши сумму цифрами, например 25000'); return; }
  var want = Math.round(parseFloat(raw) * 100);
  var flow = balance() - (+S.settings.startBalance || 0);
  store.setSettings({startBalance: want - flow}).catch(dbErr);
  toast('Баланс обновлён'); closeSheet();
});

/* ================= клики по экранам ================= */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-tab],[data-tx],[data-go],[data-m],[data-sw],[data-hw],[data-ht],[data-cat],[data-act]');
  if (!t || t.closest('.sheet')) return;
  if (t.hasAttribute('data-tab')) return go(t.getAttribute('data-tab'));
  if (t.hasAttribute('data-tx')){ var tx = S.tx.filter(function(x){ return x.id === t.getAttribute('data-tx'); })[0]; if (tx) openTx(tx); return; }
  if (t.hasAttribute('data-go')){ if (t.hasAttribute('data-who')) { S.statsWho = t.getAttribute('data-who'); S.month = curMonth(); } return go(t.getAttribute('data-go')); }
  if (t.hasAttribute('data-m')){ if (t.disabled) return; S.month = shiftMonth(S.month, +t.getAttribute('data-m')); return render(); }
  if (t.hasAttribute('data-sw')){ S.statsWho = t.getAttribute('data-sw'); return render(); }
  if (t.hasAttribute('data-hw')){ S.histWho = t.getAttribute('data-hw'); return render(); }
  if (t.hasAttribute('data-ht')){ S.histType = t.getAttribute('data-ht'); return render(); }
  if (t.hasAttribute('data-cat')) return openCat(catOf(t.getAttribute('data-cat')));
  var a = t.getAttribute('data-act');
  if (a === 'newcat') return openCat(null);
  if (a === 'bal'){ $('#bVal').value = ''; openSheet('sBal'); return; }
  if (a === 'reset'){ store.reset(); toast('Примеры возвращены'); return; }
  if (a === 'logout'){ if (window.firebase) firebase.auth().signOut(); return; }
});
$('#fab').addEventListener('click', function(){ openTx(null); });

/* ================= запуск ================= */
var unlisten = null;
function show(id){ ['splash','login','main'].forEach(function(x){ document.getElementById(x).hidden = x !== id; }); }
function startData(){
  S.ready = {tx:false, cats:false};
  unlisten = store.listen(
    function(tx){ S.tx = tx.filter(function(t){ return t && typeof t.amount === 'number' && t.date; }); var first = !S.ready.tx; S.ready.tx = true; maybeFirst(first); },
    function(cats){ S.cats = cats.slice().sort(function(a, b){ return (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(String(b.name)); }); var first = !S.ready.cats; S.ready.cats = true; maybeFirst(first); },
    function(st){ S.settings = st || {}; if (S.ready.tx && S.ready.cats) render(); }
  );
}
var shownMain = false;
function maybeFirst(){
  if (!S.ready.tx || !S.ready.cats) return;
  if (!shownMain){ shownMain = true; show('main'); render(true); }
  else render();
}
function personByEmail(em){
  em = (em || '').toLowerCase();
  if (em && em === PEOPLE.a.email) return 'a';
  if (em && em === PEOPLE.n.email) return 'n';
  return 's';
}

function bootDemo(){
  $('#demoBadge').hidden = false;
  S.me = 'a'; store = DemoStore(); startData();
}

function bootFirebase(){
  var base = 'https://www.gstatic.com/firebasejs/' + FB_VER + '/';
  loadScript(base + 'firebase-app-compat.js')
    .then(function(){ return Promise.all([loadScript(base + 'firebase-auth-compat.js'), loadScript(base + 'firebase-firestore-compat.js')]); })
    .then(function(){
      firebase.initializeApp(CFG.firebase);
      var db = firebase.firestore();
      var pers = db.enablePersistence({synchronizeTabs:true}).catch(function(){});
      pers.then(function(){
        firebase.auth().onAuthStateChanged(function(u){
          if (unlisten){ unlisten(); unlisten = null; }
          if (u){
            S.email = u.email || ''; S.me = personByEmail(u.email);
            store = FirebaseStore(db); shownMain = false; show('splash'); $('#splashTxt').textContent = 'Загружаем траты…';
            startData();
          } else { shownMain = false; show('login'); }
        });
      });
    })
    .catch(function(){ $('#splashTxt').textContent = 'Не получилось подключиться. Проверь интернет и открой приложение снова.'; });

  $('#loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var em = $('#lEmail').value.trim(), pw = $('#lPass').value, err = $('#lErr'), btn = $('#lBtn');
    if (!em || !pw){ err.textContent = 'Впиши почту и пароль.'; return; }
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Входим…';
    firebase.auth().signInWithEmailAndPassword(em, pw).catch(function(x){
      var c = x && x.code;
      err.textContent = c === 'auth/too-many-requests' ? 'Слишком много попыток. Подожди пару минут.'
        : c === 'auth/network-request-failed' ? 'Нет интернета. Проверь подключение.'
        : c === 'auth/invalid-email' ? 'Почта введена с ошибкой.'
        : 'Неверная почта или пароль.';
    }).then(function(){ btn.disabled = false; btn.textContent = 'Войти'; });
  });
}

if (DEMO) bootDemo(); else bootFirebase();

if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self && !DEMO_PREVIEW()){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
function DEMO_PREVIEW(){ return !!window.__PREVIEW__; }

document.addEventListener('visibilitychange', function(){ if (!document.hidden && S.ready.tx) render(); });
})();
</script>
</body>
</html>
